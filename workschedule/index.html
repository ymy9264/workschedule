<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排班表</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f0ede6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem 4rem;
    }

    .app { width: 100%; max-width: 400px; }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.25rem;
    }

    .title-icon {
      width: 38px;
      height: 38px;
      background: #2ca87a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .title-text { font-size: 1.1rem; font-weight: 600; color: #1a1a1a; }
    .title-sub  { font-size: 12px; color: #999; margin-top: 1px; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      margin-bottom: 1rem;
    }

    /* Month nav */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .month-display { font-size: 1.2rem; font-weight: 600; color: #1a1a1a; }
    .month-sub { font-size: 12px; color: #aaa; font-weight: 400; margin-left: 6px; }

    .nav-btn {
      width: 34px; height: 34px;
      border: none;
      background: #f2f0eb;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1rem;
      color: #666;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }
    .nav-btn:hover  { background: #e8e5de; }
    .nav-btn:active { transform: scale(0.95); }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.25rem;
    }

    .stat-card {
      background: #f7f6f2;
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-num { font-size: 1.35rem; font-weight: 600; color: #1a1a1a; }
    .stat-num.green { color: #2ca87a; }
    .stat-label { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* Weekday labels */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 5px;
    }

    .weekday {
      text-align: center;
      font-size: 11px;
      color: #bbb;
      padding: 3px 0;
    }
    .weekday.weekend { color: #e8937f; }

    /* Day grid */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      position: relative;
    }

    .day.empty { background: transparent; }

    .day.work { background: #e5f5ee; }
    .day.rest { background: #f7f6f2; }

    .day.today.work { box-shadow: inset 0 0 0 2px #2ca87a; }
    .day.today.rest { box-shadow: inset 0 0 0 2px #e0a853; }

    .day-num {
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
    }

    .day.work .day-num  { color: #1a7a57; }
    .day.rest .day-num  { color: #999; }

    .day-label { font-size: 9px; margin-top: 2px; }
    .day.work .day-label { color: #2ca87a; }
    .day.rest .day-label { color: #ccc; }

    /* Legend */
    .legend {
      display: flex;
      gap: 1.2rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #f0efea;
      justify-content: center;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }

    .legend-dot { width: 13px; height: 13px; border-radius: 4px; }

    /* Anchor section */
    .anchor-card {
      background: #fff;
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    .anchor-head {
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 4px;
    }

    .anchor-hint {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 10px;
    }

    .anchor-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #e8e5de;
      border-radius: 10px;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafaf8;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .anchor-input:focus { border-color: #2ca87a; background: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="app">

      <div class="title-row">
        <div class="title-icon">📅</div>
        <div>
          <div class="title-text">排班表</div>
          <div class="title-sub">上 1 休 2 排班日历</div>
        </div>
      </div>

      <div class="card">
        <!-- Month nav -->
        <div class="header">
          <button class="nav-btn" @click="prevMonth">‹</button>
          <div class="month-display">
            {{ year }}年{{ month + 1 }}月
            <span class="month-sub" v-if="isCurrentMonth">本月</span>
          </div>
          <button class="nav-btn" @click="nextMonth">›</button>
        </div>

        <!-- Stats -->
        <div class="stats">
          <div class="stat-card">
            <div class="stat-num green">{{ workDaysCount }}</div>
            <div class="stat-label">上班天</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">{{ restDaysCount }}</div>
            <div class="stat-label">休息天</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" :class="nextWorkInfo.soon ? 'green' : ''">{{ nextWorkInfo.label }}</div>
            <div class="stat-label">下次上班</div>
          </div>
        </div>

        <!-- Weekday labels -->
        <div class="weekdays">
          <div class="weekday" v-for="d in weekDays" :key="d"
               :class="{ weekend: d === '六' || d === '日' }">{{ d }}</div>
        </div>

        <!-- Day grid -->
        <div class="days">
          <div v-for="(cell, i) in calendarCells" :key="i"
               class="day" :class="getCellClass(cell)">
            <template v-if="cell">
              <div class="day-num">{{ cell.date }}</div>
              <div class="day-label">{{ cell.isWork ? '班' : '休' }}</div>
            </template>
          </div>
        </div>

        <!-- Legend -->
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:#e5f5ee; border:1.5px solid #2ca87a;"></div>
            <span>上班</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#f7f6f2; border:1px solid #e5e3dc;"></div>
            <span>休息</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:transparent; border:2px solid #2ca87a;"></div>
            <span>今天</span>
          </div>
        </div>
      </div>

      <!-- Anchor setter -->
      <div class="anchor-card">
        <div class="anchor-head">校准排班周期</div>
        <div class="anchor-hint">输入一个已知的上班日期，日历会据此自动推算</div>
        <input type="date" class="anchor-input" v-model="anchorDateStr" />
      </div>

    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const year  = ref(today.getFullYear());
        const month = ref(today.getMonth());

        const pad = n => String(n).padStart(2, '0');
        const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        const anchorDateStr = ref(fmt(today));

        const weekDays = ['一','二','三','四','五','六','日'];

        const anchorDate = computed(() => {
          const d = new Date(anchorDateStr.value + 'T00:00:00');
          return d;
        });

        // 上1休2：以 anchor 为第0天（上班），周期3
        const isWorkDay = (date) => {
          const diff = Math.round((date - anchorDate.value) / 86400000);
          return ((diff % 3) + 3) % 3 === 0;
        };

        const isCurrentMonth = computed(() =>
          year.value === today.getFullYear() && month.value === today.getMonth()
        );

        const calendarCells = computed(() => {
          const firstDay = new Date(year.value, month.value, 1);
          let startDow = (firstDay.getDay() + 6) % 7; // Mon=0
          const daysInMonth = new Date(year.value, month.value + 1, 0).getDate();
          const cells = Array(startDow).fill(null);
          for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year.value, month.value, d);
            cells.push({
              date: d,
              fullDate: date,
              isWork: isWorkDay(date),
              isToday: date.getTime() === today.getTime()
            });
          }
          return cells;
        });

        const workDaysCount = computed(() =>
          calendarCells.value.filter(c => c && c.isWork).length
        );
        const restDaysCount = computed(() =>
          calendarCells.value.filter(c => c && !c.isWork).length
        );

        const nextWorkInfo = computed(() => {
          if (isWorkDay(today)) return { label: '今天', soon: true };
          for (let i = 1; i <= 14; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() + i);
            if (isWorkDay(d)) {
              if (i === 1) return { label: '明天', soon: true };
              if (i === 2) return { label: '后天', soon: true };
              return { label: `${i}天后`, soon: false };
            }
          }
          return { label: '-', soon: false };
        });

        const getCellClass = (cell) => {
          if (!cell) return 'empty';
          const c = [cell.isWork ? 'work' : 'rest'];
          if (cell.isToday) c.push('today');
          return c.join(' ');
        };

        const prevMonth = () => {
          if (month.value === 0) { month.value = 11; year.value--; }
          else month.value--;
        };
        const nextMonth = () => {
          if (month.value === 11) { month.value = 0; year.value++; }
          else month.value++;
        };

        return {
          year, month, anchorDateStr, weekDays,
          calendarCells, workDaysCount, restDaysCount,
          nextWorkInfo, isCurrentMonth,
          getCellClass, prevMonth, nextMonth
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
